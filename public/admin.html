<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#000000"><meta name="robots" content="noindex">
<title>Admin · Nvisco Playz</title><link rel="icon" href="/brand/favicon-64.png"><link rel="stylesheet" href="/app.css"><link rel="stylesheet" href="/theme.css">
<style>.wrap{max-width:1000px;margin:0 auto;padding:18px 14px 60px}table{width:100%;border-collapse:collapse;font-size:13.5px}th,td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{color:var(--muted);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}.stat b{display:block;font-size:22px;margin-top:2px}
.tabs{margin:14px 0}.tabs button{flex:none}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:720px){.two{grid-template-columns:1fr}.scroll{overflow-x:auto}}
form.inline,.inline{display:flex;gap:8px;flex-wrap:wrap;align-items:end}form.inline>div,.inline>div{flex:1;min-width:120px}
.topbar{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}.topbar img{height:26px;width:auto}
.login{max-width:420px;margin:8vh auto 0}</style></head>
<body><div class="wrap"><div id="root"><div class="card muted">Loading…</div></div></div>
<div class="toasts" id="toasts"></div><script type="module" src="/js/admin.js"></script></body></html>
