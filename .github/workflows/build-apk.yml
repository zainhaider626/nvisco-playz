name: Build APK
# Builds the Android app. The app is a thin shell that opens your live server, so you only rebuild the APK
# when the app icon, name or server address changes. Game updates need NO new APK: just deploy the server.
on:
  workflow_dispatch:
    inputs:
      server_url:
        description: "Public address of your game server, e.g. https://play.nvisco.com (leave empty to use the SERVER_URL variable)"
        required: false
        type: string
      version_code:
        description: "Version number, must go up each release (2, 3, 4 ...)"
        required: false
        default: "1"
        type: string
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SERVER_URL: ${{ inputs.server_url || vars.SERVER_URL }}
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Check the server address
        run: |
          if [ -z "$SERVER_URL" ]; then echo "::error::Set the SERVER_URL variable (Settings > Secrets and variables > Actions > Variables) or type it when you run this workflow."; exit 1; fi
          echo "Building for $SERVER_URL"
      - name: Install and sync
        working-directory: mobile
        run: |
          npm ci
          npx cap sync android
      - name: Prepare signing key (optional)
        id: key
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > "$RUNNER_TEMP/release.keystore"; echo "signed=true" >> "$GITHUB_OUTPUT"; else echo "signed=false" >> "$GITHUB_OUTPUT"; echo "::warning::No signing key set. Building a test APK that cannot be updated in place. See BUILD-APK.md step 4."; fi
      - name: Build signed release APK
        if: steps.key.outputs.signed == 'true'
        working-directory: mobile/android
        env:
          APP_VERSION_CODE: ${{ inputs.version_code }}
          APP_VERSION_NAME: 1.0.${{ inputs.version_code }}
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease && cp app/build/outputs/apk/release/app-release.apk ../../NviscoPlayz.apk
      - name: Build test APK (debug-signed)
        if: steps.key.outputs.signed != 'true'
        working-directory: mobile/android
        env:
          APP_VERSION_CODE: ${{ inputs.version_code }}
          APP_VERSION_NAME: 1.0.${{ inputs.version_code }}
        run: ./gradlew --no-daemon assembleDebug && cp app/build/outputs/apk/debug/app-debug.apk ../../NviscoPlayz.apk
      - uses: actions/upload-artifact@v4
        with:
          name: NviscoPlayz-apk
          path: NviscoPlayz.apk
          if-no-files-found: error
      - name: Publish a download link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="apk-v${{ inputs.version_code }}-${{ github.run_number }}"
          gh release create "$TAG" NviscoPlayz.apk --title "Nvisco Playz APK $TAG" --notes "Install this file on Android. Allow 'install unknown apps' when asked." 
          echo "Download link: https://github.com/${{ github.repository }}/releases/download/$TAG/NviscoPlayz.apk" >> "$GITHUB_STEP_SUMMARY"
