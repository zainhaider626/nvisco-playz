name: Build APK
# Builds the Android app. The app is a thin shell that opens your live server, so you only rebuild the APK
# when the app icon, name or server address changes. Game updates need NO new APK: just deploy the server.
on:
  workflow_dispatch:
    inputs:
      server_url:
        description: "Public address of your game server, e.g. https://play.nvisco.com (leave empty to use the SERVER_URL variable)"
        required: false
        type: string
      version_code:
        description: "Version number, must go up each release (2, 3, 4 ...)"
        required: false
        default: "1"
        type: string
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SERVER_URL: ${{ inputs.server_url || vars.SERVER_URL }}
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Check the server address
        run: |
          if [ -z "$SERVER_URL" ]; then echo "::error::Set the SERVER_URL variable (Settings > Secrets and variables > Actions > Variables) or type it when you run this workflow."; exit 1; fi
          echo "Building for $SERVER_URL"
      - name: Install and sync
        working-directory: mobile
        run: |
          npm ci
          npx cap sync android
      - name: Prepare signing key (optional)
        id: key
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KA: ${{ secrets.ANDROID_KEY_ALIAS }}
          KP: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KS" ]; then echo "signed=false" >> "$GITHUB_OUTPUT"; echo "::warning::No signing key set. Building a test APK that cannot be updated in place. See BUILD-APK.md step 4."; exit 0; fi
          # Phones add stray spaces and line breaks when pasting; remove them.
          clean() { printf '%s' "$1" | tr -d ' \r\n\t'; }
          KS=$(clean "$KS"); SP=$(clean "$SP"); KA=$(clean "$KA"); KP=$(clean "$KP")
          # A PKCS12 key file uses one password for both; accept either secret being left out.
          SP=${SP:-$KP}; KP=${KP:-$SP}
          printf '%s' "$KS" | base64 -d > "$RUNNER_TEMP/release.keystore" || { echo "::error::ANDROID_KEYSTORE_BASE64 is not valid base64 (length ${#KS}). Copy the whole text again."; exit 1; }
          echo "Secret lengths: keystore text ${#KS} chars, store password ${#SP}, alias ${#KA}, key password ${#KP}"
          if ! keytool -list -keystore "$RUNNER_TEMP/release.keystore" -storepass "$SP" > "$RUNNER_TEMP/kt.txt" 2>&1; then
            cat "$RUNNER_TEMP/kt.txt" | grep -v JAVA_TOOL | head -5
            echo "::error::The signing key could not be opened: ANDROID_KEYSTORE_PASSWORD is wrong or ANDROID_KEYSTORE_BASE64 is cut off (expected about 3500 characters; the store password in the guide has 18)."
            exit 1
          fi
          grep -i "PrivateKeyEntry" "$RUNNER_TEMP/kt.txt" | head -2
          echo "::add-mask::$SP"; echo "::add-mask::$KP"
          { echo "ANDROID_KEYSTORE_PASSWORD=$SP"; echo "ANDROID_KEY_ALIAS=$KA"; echo "ANDROID_KEY_PASSWORD=$KP"; } >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"
      - name: Build signed release APK
        if: steps.key.outputs.signed == 'true'
        working-directory: mobile/android
        env:
          APP_VERSION_CODE: ${{ inputs.version_code }}
          APP_VERSION_NAME: 1.0.${{ inputs.version_code }}
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
        run: ./gradlew --no-daemon assembleRelease && cp app/build/outputs/apk/release/app-release.apk ../../NviscoPlayz.apk
      - name: Build test APK (debug-signed)
        if: steps.key.outputs.signed != 'true'
        working-directory: mobile/android
        env:
          APP_VERSION_CODE: ${{ inputs.version_code }}
          APP_VERSION_NAME: 1.0.${{ inputs.version_code }}
        run: ./gradlew --no-daemon assembleDebug && cp app/build/outputs/apk/debug/app-debug.apk ../../NviscoPlayz.apk
      - uses: actions/upload-artifact@v4
        with:
          name: NviscoPlayz-apk
          path: NviscoPlayz.apk
          if-no-files-found: error
      - name: Publish a download link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="apk-v${{ inputs.version_code }}-${{ github.run_number }}"
          gh release create "$TAG" NviscoPlayz.apk --title "Nvisco Playz APK $TAG" --notes "Install this file on Android. Allow 'install unknown apps' when asked." 
          echo "Download link: https://github.com/${{ github.repository }}/releases/download/$TAG/NviscoPlayz.apk" >> "$GITHUB_STEP_SUMMARY"
